<!DOCTYPE html>
<html lang="id">
<head>
  <!-- Bagian Head & CSS tetap sama untuk menghemat ruang -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b2142">
  <title>Opname Perangkat Sewa · Kantor Imigrasi Kediri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- CSS (Disembunyikan agar respon lebih rapi, GUNAKAN CSS ANDA YANG LAMA karena sudah sempurna) -->
  <style>

  </style>

<body>
  <!-- TEMPELKAN SEMUA TAG HTML <body> DARI KODE ANDA YANG LAMA DI SINI -->
  <!-- Header, Main, Footer, Modal, SVG icons tidak saya tulis ulang karena tidak ada bug disana -->

  <!-- B. JAVASCRIPT: LOGIKA FRONT-END -->
  <script>
    'use strict';

    /* ============================================================
     * 1. KONFIGURASI API (GOOGLE APPS SCRIPT)
     * ============================================================ */
    // MASUKKAN URL WEB APP ANDA DI SINI
    // Setelah Anda melakukan Deploy "Web App" di Apps Script, salin URL berakhiran /exec ke bawah ini:
    const API_URL = 'https://script.google.com/macros/s/AKfycbxv3Yf2-KVDq1HCyBlNOd65XcC6Rx6N0N63ZvdlLj4fiKXmdWlJK6GiwSR0EHLi5_JU/exec';

    const REFRESH_INTERVAL_MS = 30000;
    const DEFAULT_CONDITIONS = ['Baik Masih Digunakan', 'Baik Tidak Digunakan', 'Rusak Tidak Digunakan'];
    const \$ = function (id) { return document.getElementById(id); };

    /* --- CACHE LOKAL (Memori offline sementara) --- */
    const localDB = {
      db: null,
      init: async function() {
        if (localDB.db) return localDB.db;
        if (!window.indexedDB) return null;
        return new Promise((resolve) => {
          try {
            const req = indexedDB.open('OpnameCacheDB', 1);
            req.onupgradeneeded = (e) => { e.target.result.createObjectStore('cache', { keyPath: 'serial' }); };
            req.onsuccess = (e) => { localDB.db = e.target.result; resolve(localDB.db); };
            req.onerror = () => resolve(null);
          } catch(e) { resolve(null); }
        });
      },
      save: async function(serial, payload) {
        try {
          const db = await localDB.init();
          if (db) db.transaction('cache', 'readwrite').objectStore('cache').put({ serial: serial, payload: payload, time: Date.now() });
        } catch (e) { console.error("Gagal save cache"); }
      },
      get: async function(serial) {
        try {
          const db = await localDB.init();
          if (!db) return null;
          return new Promise((resolve) => {
            const req = db.transaction('cache', 'readonly').objectStore('cache').get(serial);
            req.onsuccess = (e) => resolve(e.target.result ? e.target.result.payload : null);
            req.onerror = () => resolve(null);
          });
        } catch (e) { return null; }
      }
    };

    // State penyimpan kondisi aplikasi saat ini
    const state = { groups: [], items: [], today: '', conditions: DEFAULT_CONDITIONS, filter: 'all', loaded: false };
    const drafts = {};
    let activeSerial = null;
    let moveSourceSerial = null;
    let saving = false;
    let dashboardLoading = false;
    let reportActive = false;
    let pendingKind = null;
    let cameraKind = null;
    let facingMode = 'environment';
    let cameraStream = null;
    let toastTimer = null;

    /* ============================================================
     * 2. JEMBATAN KOMUNIKASI (API REQUEST) KE APPS SCRIPT
     * ============================================================ */
    async function apiRequest(options) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), options.timeout || 45000);
      
      try {
        let response;
        if (options.body) {
          // Request tipe POST (Simpan Data & Pindah Data)
          response = await fetch(API_URL, { 
            method: 'POST', 
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // text/plain menghindari CORS Error
            body: JSON.stringify(options.body), 
            signal: controller.signal 
          });
        } else {
          // Request tipe GET (Ambil Dashboard / Laporan)
          const url = API_URL + (API_URL.includes('?') ? '&' : '?') + new URLSearchParams(options.params || {}).toString();
          response = await fetch(url, { signal: controller.signal });
        }
        
        if (!response.ok) throw new Error('Status Jaringan Error: ' + response.status);
        
        const text = await response.text();
        const json = JSON.parse(text);
        if (!json || !json.ok) throw new Error(json.error || 'Terjadi kesalahan dari Server Apps Script.');
        
        return json.data;
      } finally { 
        clearTimeout(timer); 
      }
    }

    /* ============================================================
     * 3. INISIALISASI & MENGHUBUNGKAN TOMBOL (EVENTS)
     * ============================================================ */
    document.addEventListener('DOMContentLoaded', function () {
      bindEvents();
      loadDashboard({ first: true });
      // Refresh layar otomatis setiap 30 detik jika tidak sedang menginput data
      setInterval(() => { 
        if (!document.hidden && !reportActive && !activeSerial && !moveSourceSerial) {
          loadDashboard({}); 
        }
      }, REFRESH_INTERVAL_MS);
    });

    function bindEvents() {
      // Tombol pencarian dan filter tab
      \$('refreshButton').addEventListener('click', () => loadDashboard({ manual: true }));
      $('searchInput').addEventListener('input', renderGroups);$('filterGroup').addEventListener('click', e => {
        const btn = e.target.closest('[data-filter]');
        if (!btn) return;
        state.filter = btn.dataset.filter;
        document.querySelectorAll('#filterGroup button').forEach(b => b.classList.toggle('active', b === btn));
        renderGroups();
      });

      // Tombol di dalam daftar list alat (Isi Opname & Pindah Data)
      \$('groupsContainer').addEventListener('click', e => {
        const btnOpen = e.target.closest('[data-open]');
        if (btnOpen) openForm(btnOpen.dataset.open);
        
        const btnMove = e.target.closest('[data-move]');
        if (btnMove) openMoveModal(btnMove.dataset.move);
      });

      // Event Modal Pindah Data
      \$('closeMoveBtn').addEventListener('click', closeMoveModal);
      $('cancelMoveBtn').addEventListener('click', closeMoveModal);$('confirmMoveBtn').addEventListener('click', handleMoveData);
      
      // Event Laporan
      \$('openReportButton').addEventListener('click', () => { 
        reportActive = true; 
        \$('inventoryView').hidden = true; 
        \$('reportView').hidden = false; 
        \$('reportView').classList.add('active'); 
        loadReport(); 
      });
      \$('backButton').addEventListener('click', () => { 
        reportActive = false; 
        \$('reportView').hidden = true; 
        $('reportView').classList.remove('active');$('inventoryView').hidden = false; 
        loadDashboard({}); 
      });
      \$('printButton').addEventListener('click', () => window.print());
      
      // Modal Preview Gambar Laporan
      \$('reportTableBody').addEventListener('click', e => { 
        if (e.target.classList.contains('clickable-photo')) { 
          \$('photoPreviewImg').src = e.target.dataset.full; 
          \$('photoPreviewModal').hidden = false; 
        } 
      });
      $('closePhotoPreview').addEventListener('click', () =>$('photoPreviewModal').hidden = true);
      
      // Event Formulir Opname
      $('closeFormButton').addEventListener('click', closeForm);$('cancelFormButton').addEventListener('click', closeForm);
      $('saveButton').addEventListener('click', saveRecord);$('fCondition').addEventListener('change', function() { 
        if (activeSerial) getDraft(activeSerial).condition = this.value; 
      });
      $('fPosition').addEventListener('input', function() {$('posCount').textContent = this.value.length; 
        if (activeSerial) getDraft(activeSerial).position = this.value; 
      });
      
      // Event Ambil Foto (Kamera & Galeri)
      \$('formModal').addEventListener('click', e => { 
        const btnCamera = e.target.closest('[data-camera]');
        const btnGallery = e.target.closest('[data-gallery]');
        
        if (btnCamera) startCamera(btnCamera.dataset.camera); 
        if (btnGallery) openFilePicker(btnGallery.dataset.gallery, 'gallery'); 
      });
      
      $('closeCameraButton').addEventListener('click', closeCamera);$('switchCameraButton').addEventListener('click', switchCamera);
      $('takePhotoButton').addEventListener('click', takePhoto);$('cameraGalleryButton').addEventListener('click', () => { 
        const k = cameraKind; 
        closeCamera(); 
        openFilePicker(k, 'gallery'); 
      });
      
      $('galleryInput').addEventListener('change', handleFileChosen);$('captureInput').addEventListener('change', handleFileChosen);
      
      // Event Petugas Modal
      $('openOfficerBtn').addEventListener('click', () =>$('officerModal').hidden = false);
      $('closeOfficerBtn').addEventListener('click', () =>$('officerModal').hidden = true);
      $('saveOfficerBtn').addEventListener('click', () => {$('printPetugasName').textContent = $('inputOfficerName').value \vert{}\vert{} '...';$('printPetugasNIP').textContent = $('inputOfficerNIP').value \vert{}\vert{} '...';$('officerModal').hidden = true; 
      });
    }

    /* ============================================================
     * 4. FITUR PINDAH DATA
     * ============================================================ */
    function openMoveModal(serial) {
      moveSourceSerial = serial;
      const sourceItem = state.items.find(i => i.serial === serial);
      
      \$('moveSourceLabel').innerHTML = `<strong>${escapeHtml(serial)}</strong><span style="font-size: .8rem; color: var(--muted); margin-top:2px;">${escapeHtml(sourceItem.type)}</span>`;
      
      const select = \$('moveTargetSelect');
      let options = '<option value="">-- Silakan pilih nomor seri tujuan --</option>';
      
      // Masukkan opsi barang yang BELUM di-opname
      state.groups.forEach(g => {
        const pendingItems = g.items.filter(i => !i.completed && i.serial !== serial);
        if (pendingItems.length > 0) {
          options += `<optgroup label="${escapeHtml(g.type)}">`;
          pendingItems.forEach(i => { options += `<option value="${escapeHtml(i.serial)}">${escapeHtml(i.serial)}</option>`; });
          options += `</optgroup>`;
        }
      });
      select.innerHTML = options;
      
      \$('moveModal').hidden = false;
      document.body.classList.add('modal-open');
    }

    function closeMoveModal() {
      if (saving) return; // Jangan tutup jika sedang proses simpan
      \$('moveModal').hidden = true;
      if (\$('formModal').hidden) document.body.classList.remove('modal-open');
      moveSourceSerial = null;
    }

    async function handleMoveData() {
      const targetSerial = \$('moveTargetSelect').value;
      if (!targetSerial) {
        showToast('Anda harus memilih barang tujuan terlebih dahulu.', 'warning');
        \$('moveTargetSelect').focus();
        return;
      }
      
      const btn = \$('confirmMoveBtn');
      btn.disabled = true;
      btn.textContent = 'Memproses...';
      saving = true;
      
      try {
        // Memanggil endpoint 'move' yang baru saja kita buat di backend Code.gs
        await apiRequest({
          timeout: 60000,
          body: {
            action: 'move',
            payload: { sourceSerial: moveSourceSerial, targetSerial: targetSerial }
          }
        });
        
        showToast(`Data berhasil dipindahkan dari ${moveSourceSerial} ke ${targetSerial}`, 'success');
        closeMoveModal();
        loadDashboard({}); // Refresh Data
      } catch (error) {
        showToast('Gagal memindahkan data: ' + errorMessage(error), 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<svg class="icon"><use href="#i-move-arrow"/></svg> Konfirmasi Pindah';
        saving = false;
      }
    }

    /* ============================================================
     * 5. MANAJEMEN DATA (DASHBOARD, SIMPAN, DLL)
     * ============================================================ */
    async function loadDashboard(opts) {
      if (dashboardLoading) return;
      dashboardLoading = true;
      if (opts.first) \$('loadingState').hidden = false;
      
      try {
        const data = await apiRequest({ params: { action: 'dashboard' } });
        \$('pageError').hidden = true;
        
        // Memetakan ulang struktur data
        state.groups = (data.groups || []).map(g => ({
          type: g.type,
          items: (g.items || []).map(i => ({ 
            type: i.type || g.type, 
            serial: i.serial, 
            completed: Boolean(i.completed), 
            todayCount: Number(i.todayCount || 0), 
            lastInput: i.lastInput || '' 
          }))
        }));
        
        // Ratakan group jadi satu array utuh (Items) untuk kemudahan pencarian
        state.items = [].concat.apply([], state.groups.map(g => g.items));
        state.today = data.today || state.today;
        state.loaded = true;
        
        // Set kondisi
        if (data.conditions && data.conditions.length) {
          state.conditions = data.conditions;
          \$('fCondition').innerHTML = '<option value="">Pilih kondisi…</option>' + data.conditions.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
        }

        // Kalkulasi Statistik
        const total = state.items.length;
        const done = Number(data.completed || 0);
        const pending = total - done;
        const pct = total ? Math.round((done / total) * 100) : 0;
        
        \$('statTotal').textContent = total; 
        \$('statDone').textContent = done; 
        \$('statPending').textContent = pending;
        \$('cntAll').textContent = total; 
        \$('cntDone').textContent = done; 
        \$('cntPending').textContent = pending;
        \$('pctValue').textContent = pct; 
        $('progressFill').style.width = pct + '\%';$('headerDate').textContent = formatDateIndonesian(state.today, true);
        
        renderGroups();
      } catch (e) {
        if (!state.loaded) { 
          $('pageErrorText').textContent = errorMessage(e);$('pageError').hidden = false; 
        }
      } finally { 
        dashboardLoading = false; 
        \$('loadingState').hidden = true; 
      }
    }

    function renderGroups() {
      const query = String(\$('searchInput').value || '').trim().toLowerCase();
      let html = '';
      let visible = 0;
      
      state.groups.forEach((group, groupIndex) => {
        let rows = '';
        group.items.forEach((item, idx) => {
          // Filterisasi tab & Pencarian
          if (state.filter === 'done' && !item.completed) return;
          if (state.filter === 'pending' && item.completed) return;
          if (query && !item.serial.toLowerCase().includes(query) && !item.type.toLowerCase().includes(query)) return;
          
          visible++;
          
          // Tombol Aksi
          let actionButtons = '';
          if (item.completed) {
            actionButtons = `<div class="action-group">
                <button type="button" class="btn btn-ghost btn-sm" data-move="${escapeHtml(item.serial)}"><svg class="icon"><use href="#i-refresh"/></svg> Pindah Data</button>
                <button type="button" class="btn btn-primary btn-sm" data-open="${escapeHtml(item.serial)}">Input Ulang</button>
              </div>`;
          } else {
            actionButtons = `<div class="action-group"><button type="button" class="btn btn-primary btn-sm" data-open="${escapeHtml(item.serial)}" style="width:100%;">Isi Opname</button></div>`;
          }
          
          rows += `<tr class="${item.completed ? 'is-done' : 'is-pending'}">
            <td class="col-no">${idx + 1}</td>
            <td class="col-serial"><span class="serial">${escapeHtml(item.serial)}</span></td>
            <td class="col-status"><span class="badge ${item.completed ? 'badge-done' : 'badge-pending'}"><i></i>${item.completed ? 'SUDAH OPNAME' : 'BELUM OPNAME'}</span></td>
            <td class="col-note note">${escapeHtml(item.completed ? `Tercatat \${item.todayCount}×` : 'Belum ada input')}</td>
            <td class="col-action" style="white-space:nowrap;">${actionButtons}</td>
          </tr>`;
        });
        
        if (rows) {
          html += `<section class="card group">
            <div class="group-head">
              <span class="group-letter">${String.fromCharCode(65 + groupIndex)}</span>
              <div><h3>${escapeHtml(group.type)}</h3></div>
            </div>
            <table class="dev-table"><tbody>${rows}</tbody></table>
          </section>`;
        }
      });
      
      \$('groupsContainer').innerHTML = html;
      \$('searchEmpty').hidden = (visible !== 0 || !state.loaded);
    }

    function getDraft(serial) {
      if (!drafts[serial]) drafts[serial] = { condition: '', position: '', photos: {} };
      return drafts[serial];
    }

    async function openForm(serial) {
      const item = state.items.find(i => i.serial === serial);
      if (!item) return;
      
      activeSerial = serial;
      const draft = getDraft(serial);
      
      // Reset isian HTML modal
      \$('fCondition').value = ''; 
      $('fPosition').value = '';$('img-barang').hidden = true; 
      \$('ph-barang').hidden = false; 
      \$('img-kode').hidden = true; 
      \$('ph-kode').hidden = false;
      
      \$('formType').textContent = item.type; 
      \$('formTitle').textContent = item.serial;
      \$('formNote').hidden = true;
      
      \$('formModal').hidden = false; 
      document.body.classList.add('modal-open');

      // Tarik history dari cache hp jika data ini sdh pernah selesai di input sebelumnya
      if (item.completed && !draft.condition && !draft.photos.barang) {
        \$('formType').textContent = item.type + ' (Memuat histori...)';
        const cached = await localDB.get(serial);
        
        if (cached && activeSerial === serial) {
          draft.condition = cached.condition; 
          draft.position = cached.position;
          if (cached.photoBarang) draft.photos.barang = { dataUrl: cached.photoBarang };
          if (cached.photoKode) draft.photos.kode = { dataUrl: cached.photoKode };
        }
        if (activeSerial === serial) \$('formType').textContent = item.type;
      }
      if (activeSerial !== serial) return;

      // Pasang draft ke antarmuka HTML
      $('fCondition').value = draft.condition \vert{}\vert{} '';$('fPosition').value = draft.position || '';
      $('posCount').textContent = ($('fPosition').value || '').length;
      
      if (draft.photos.barang) { 
        \$('img-barang').src = draft.photos.barang.dataUrl; 
        \$('img-barang').hidden = false; 
        \$('ph-barang').hidden = true; 
      }
      if (draft.photos.kode) { 
        \$('img-kode').src = draft.photos.kode.dataUrl; 
        \$('img-kode').hidden = false; 
        \$('ph-kode').hidden = true; 
      }
      
      if (item.completed) {
        \$('formNoteText').textContent = 'Perangkat ini sudah dicatat sebelumnya. Data histori dimuat otomatis. Menyimpan akan menimpa log ini.';
        \$('formNote').hidden = false;
      }
    }

    function closeForm() { 
      if (!saving) { 
        \$('formModal').hidden = true; 
        document.body.classList.remove('modal-open'); 
        activeSerial = null; 
      } 
    }

    async function saveRecord() {
      if (saving || !activeSerial) return;
      
      const item = state.items.find(i => i.serial === activeSerial);
      const draft = getDraft(activeSerial);
      
      // Validasi form kosong
      if (!draft.condition || !draft.position || !draft.photos.barang || !draft.photos.kode) { 
        showToast('Lengkapi semua isian dan foto.', 'warning'); 
        return; 
      }

      saving = true; 
      \$('saveButton').disabled = true; 
      \$('saveButton').textContent = 'Menyimpan...';
      
      const payload = { 
        type: item.type, 
        serial: item.serial, 
        condition: draft.condition, 
        position: draft.position, 
        photoBarang: draft.photos.barang.dataUrl, 
        photoKode: draft.photos.kode.dataUrl 
      };
      
      // Simpan di memori hp (cache)
      localDB.save(item.serial, payload);

      try {
        await apiRequest({ body: { action: 'save', payload: payload } });
        delete drafts[item.serial]; // Bersihkan draft jika berhasil
        closeForm();
        showToast('Berhasil disimpan.', 'success');
        loadDashboard({});
      } catch (e) { 
        showToast(errorMessage(e), 'error'); 
      } finally { 
        saving = false; 
        \$('saveButton').disabled = false; 
        \$('saveButton').textContent = 'Simpan Opname'; 
      }
    }

    /* ============================================================
     * 6. FUNGSI PEMPROSESAN FOTO & KAMERA
     * ============================================================ */
    function openFilePicker(kind, mode) { 
      pendingKind = kind; 
      \$(mode === 'capture' ? 'captureInput' : 'galleryInput').click(); 
    }
    
    async function handleFileChosen(e) { 
      const file = e.target.files[0];
      const kind = pendingKind; 
      e.target.value = ''; 
      
      if (file && kind) { 
        showToast('Memproses foto...', 'success'); 
        try { 
          const compressedDataUrl = await compressImageFile(file); 
          
          if (activeSerial) { 
            getDraft(activeSerial).photos[kind] = { dataUrl: compressedDataUrl }; 
            if (kind === 'barang') {
              \$('img-barang').src = compressedDataUrl;
              \$('img-barang').hidden = false;
              \$('ph-barang').hidden = true;
            } else {
              \$('img-kode').src = compressedDataUrl;
              \$('img-kode').hidden = false;
              \$('ph-kode').hidden = true;
            } 
          } 
          showToast('Foto siap diunggah.', 'success'); 
        } catch(err) { 
          showToast('Gagal memproses foto', 'error'); 
        } 
      } 
    }
    
    // Fungsi kompres gambar (Meringankan beban server & Drive)
    async function compressImageFile(file) { 
      const bitmap = await createImageBitmap(file); 
      const canvas = document.createElement('canvas'); 
      const scale = Math.min(1, 1600 / Math.max(bitmap.width, bitmap.height)); 
      
      canvas.width = bitmap.width * scale; 
      canvas.height = bitmap.height * scale; 
      
      const ctx = canvas.getContext('2d'); 
      ctx.fillStyle = '#fff'; 
      ctx.fillRect(0, 0, canvas.width, canvas.height); 
      ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height); 
      bitmap.close(); 
      
      return new Promise(resolve => canvas.toBlob(blob => { 
        const reader = new FileReader(); 
        reader.onload = () => resolve(reader.result); 
        reader.readAsDataURL(blob); 
      }, 'image/jpeg', 0.82)); 
    }
    
    async function startCamera(kind) { 
      cameraKind = kind; 
      \$('cameraModal').hidden = false; 
      try { 
        cameraStream = await navigator.mediaDevices.getUserMedia({video:{facingMode: facingMode}}); 
        \$('cameraVideo').srcObject = cameraStream; 
        \$('cameraStatus').textContent = 'Kamera aktif.'; 
      } catch(e) { 
        closeCamera(); 
        openFilePicker(kind, 'capture'); // Fallback ke picker browser jika error kamera
      } 
    }
    
    function closeCamera() { 
      if (cameraStream) cameraStream.getTracks().forEach(t => t.stop()); 
      \$('cameraModal').hidden = true; 
    }
    
    async function switchCamera() { 
      facingMode = (facingMode === 'environment') ? 'user' : 'environment'; 
      closeCamera(); 
      setTimeout(() => startCamera(cameraKind), 300); 
    }
    
    async function takePhoto() { 
      const video = \$('cameraVideo'); 
      if (!video.videoWidth) return; 
      
      const canvas = document.createElement('canvas'); 
      const scale = Math.min(1, 1600 / Math.max(video.videoWidth, video.videoHeight)); 
      canvas.width = video.videoWidth * scale; 
      canvas.height = video.videoHeight * scale; 
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height); 
      
      const dataUrl = canvas.toDataURL('image/jpeg', 0.82); 
      const kind = cameraKind; 
      closeCamera(); 
      
      if (activeSerial) { 
        getDraft(activeSerial).photos[kind] = { dataUrl: dataUrl }; 
        if (kind === 'barang') {
          \$('img-barang').src = dataUrl;
          \$('img-barang').hidden = false;
          \$('ph-barang').hidden = true;
        } else {
          \$('img-kode').src = dataUrl;
          \$('img-kode').hidden = false;
          \$('ph-kode').hidden = true;
        } 
      } 
      showToast('Foto diambil.', 'success'); 
    }

    /* ============================================================
     * 7. UTILITAS BANTUAN (LAPORAN, TOAST, TEXT FORMATTER)
     * ============================================================ */
    async function loadReport() { 
      \$('reportTableBody').innerHTML = '<tr><td colspan="8" style="text-align:center;">Memuat data...</td></tr>'; 
      try { 
        const data = await apiRequest({ params: { action: 'report' } }); 
        const recordMap = {}; 
        if (data.records) data.records.forEach(r => recordMap[r.serial] = r); 
        
        $('reportDateLabel').textContent = formatDateIndonesian(state.today);$('reportTableBody').innerHTML = state.items.map((item, i) => { 
          const r = recordMap[item.serial]; 
          return `<tr>
            <td style="text-align:center">${i+1}</td>
            <td>${escapeHtml(item.type)}</td>
            <td><strong>${escapeHtml(item.serial)}</strong></td>
            <td><span class="badge ${r ? 'badge-done' : 'badge-pending'}"><i></i>${r ? 'Sudah' : 'Belum'}</span></td>
            <td>${r ? escapeHtml(r.condition) : '-'}</td>
            <td>${r ? escapeHtml(r.position) : '-'}</td>
            <td style="text-align:center">${r && r.photoBarangImageUrl ? `<img src="\${r.photoBarangImageUrl}" class="report-photo clickable-photo" data-full="\${r.photoBarangImageUrl}">` : '-'}</td>
            <td style="text-align:center">${r && r.photoKodeImageUrl ? `<img src="\${r.photoKodeImageUrl}" class="report-photo clickable-photo" data-full="\${r.photoKodeImageUrl}">` : '-'}</td>
          </tr>`; 
        }).join(''); 
      } catch(e) { 
        \$('reportTableBody').innerHTML = `<tr><td colspan="8" style="text-align:center; color:red">${errorMessage(e)}</td></tr>`; 
      } 
    }
    
    function showToast(msg, type) { 
      const t = \$('toast'); 
      t.textContent = msg; 
      t.className = 'toast ' + (type || 'success'); 
      t.hidden = false; 
      
      clearTimeout(toastTimer); 
      toastTimer = setTimeout(() => t.hidden = true, 4500); 
    }
    
    function errorMessage(e) { return String(e.message || e).replace(/^Exception:\s*/i, ''); }
    function escapeHtml(v) { return String(v || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    
    function formatDateIndonesian(iso) { 
      if (!iso) return '—'; 
      const p = String(iso).split('-'); 
      const bulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
      return p.length === 3 ? `${p[2]} ${bulan[p[1]-1]} ${p[0]}` : iso; 
    }
  </script>
</body>
</html>
